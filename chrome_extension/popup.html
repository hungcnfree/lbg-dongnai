<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trợ Lý CSDL - THCS Đăk Ơ v5.4.0</title>
  <style>
    :root {
      --bg-paper: #FFFDF5;
      --border-dark: #0F172A;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --primary-blue: #2563EB;
      --emerald-green: #10B981;
      --radius-sm: 8px;
      --radius-md: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-paper);
      color: var(--text-dark);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .header {
      background: #FFF;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-weight: 800;
      font-size: 14px;
      color: var(--text-dark);
      line-height: 1.2;
    }
    .header-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-blue);
    }
    .version-badge {
      font-size: 11px;
      font-weight: 800;
      background: #EFF6FF;
      color: var(--primary-blue);
      border: 1.5px solid var(--border-dark);
      padding: 2px 8px;
      border-radius: 20px;
    }
    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #FFF;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: 2px 2px 0px var(--border-dark);
    }
    .card-title {
      font-weight: 800;
      font-size: 12.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dark);
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 11.5px;
      margin-bottom: 4px;
      color: #334155;
    }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      background: #FFF;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary-blue);
    }
    .password-wrap {
      position: relative;
    }
    .btn-toggle-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-main {
      width: 100%;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 800;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-main:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }
    .btn-blue {
      background: var(--primary-blue);
      color: #FFF;
    }
    .btn-green {
      background: var(--emerald-green);
      color: #FFF;
    }
    .btn-light {
      background: #F8FAFC;
      color: var(--text-dark);
    }
    .tkb-status-box {
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 11.5px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .footer {
      padding: 10px 14px;
      border-top: 1.5px solid #CBD5E1;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      background: #FAFAFA;
    }
    .footer-links {
      margin-top: 4px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .footer-link {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="header-title">TRỢ LÝ TỰ ĐỘNG CSDL</div>
      <div class="header-sub">Trường THCS Đăk Ơ</div>
    </div>
    <div class="version-badge">v5.4.0</div>
  </div>

  <div class="content">

    <!-- KHỐI 1: CẤU HÌNH TÀI KHOẢN -->
    <div class="card">
      <div class="card-title">
        <span>⚙️</span> Cấu Hình Tài Khoản Giáo Viên
      </div>

      <div class="form-group">
        <label>1. Chọn tên Thầy/Cô (60 GV toàn trường):</label>
        <select id="cfg-name" class="form-control">
          <option value="">-- Bấm chọn tên Thầy/Cô --</option>
          <option value="Bùi Thị Hải">Bùi Thị Hải</option>
          <option value="Cao Đăng Nam">Cao Đăng Nam</option>
          <option value="Chu Hải Luyện">Chu Hải Luyện</option>
          <option value="Dương Công Thành">Dương Công Thành</option>
          <option value="Dương Đình Nghĩa">Dương Đình Nghĩa</option>
          <option value="Dương Ngọc Lộc">Dương Ngọc Lộc</option>
          <option value="Dương Thị Mai">Dương Thị Mai</option>
          <option value="Đặng Quốc Triều">Đặng Quốc Triều</option>
          <option value="Đặng Thị Oanh">Đặng Thị Oanh</option>
          <option value="Điểu Cường">Điểu Cường</option>
          <option value="Đỗ Thị Kim Oanh">Đỗ Thị Kim Oanh</option>
          <option value="Đỗ Thị Thơm">Đỗ Thị Thơm</option>
          <option value="Đoàn Thị Hồng">Đoàn Thị Hồng</option>
          <option value="Hoàng Thúy Nga">Hoàng Thúy Nga</option>
          <option value="Lâm Thị Mai">Lâm Thị Mai</option>
          <option value="Lê Bích Hà">Lê Bích Hà</option>
          <option value="Lê Đình Tuyền">Lê Đình Tuyền</option>
          <option value="Lê Quang Chung">Lê Quang Chung</option>
          <option value="Lê Thị Cúc">Lê Thị Cúc</option>
          <option value="Lê Thị Huyền">Lê Thị Huyền</option>
          <option value="Lê Thị Sông Hồng">Lê Thị Sông Hồng</option>
          <option value="Lê Thị Thu">Lê Thị Thu</option>
          <option value="Lê Văn Hào">Lê Văn Hào</option>
          <option value="Lý Thị Hiền">Lý Thị Hiền</option>
          <option value="Lý Thị Thu Hương">Lý Thị Thu Hương</option>
          <option value="Mai Thị Kim Phượng">Mai Thị Kim Phượng</option>
          <option value="Ngô Thị Mỹ Hạnh">Ngô Thị Mỹ Hạnh</option>
          <option value="Nguyễn Cảnh Tài">Nguyễn Cảnh Tài</option>
          <option value="Nguyễn Công Minh">Nguyễn Công Minh</option>
          <option value="Nguyễn Đình Hoàng">Nguyễn Đình Hoàng</option>
          <option value="Nguyễn Thị Chúc">Nguyễn Thị Chúc</option>
          <option value="Nguyễn Thị Dịu">Nguyễn Thị Dịu</option>
          <option value="Nguyễn Thị Hằng">Nguyễn Thị Hằng</option>
          <option value="Nguyễn Thanh Hồng">Nguyễn Thanh Hồng</option>
          <option value="Nguyễn Thị Thu Hằng">Nguyễn Thị Thu Hằng</option>
          <option value="Nguyễn Trung Ấn">Nguyễn Trung Ấn</option>
          <option value="Nguyễn Văn Linh">Nguyễn Văn Linh</option>
          <option value="Nguyễn Văn Thụ">Nguyễn Văn Thụ</option>
          <option value="Nguyễn Thị Vân">Nguyễn Thị Vân</option>
          <option value="Nông Văn Hùng">Nông Văn Hùng</option>
          <option value="Phạm Kim Chi">Phạm Kim Chi</option>
          <option value="Phạm Tới">Phạm Tới</option>
          <option value="Tô Hồng Đình Khiết">Tô Hồng Đình Khiết</option>
          <option value="Trần Đình Hồ">Trần Đình Hồ</option>
          <option value="Trần Thu Hà">Trần Thu Hà</option>
          <option value="Trần Thị Hồng Hạnh">Trần Thị Hồng Hạnh</option>
          <option value="Trần Thị Huệ">Trần Thị Huệ</option>
          <option value="Trần Ngọc Thìn">Trần Ngọc Thìn</option>
          <option value="Trần Thị Thoan">Trần Thị Thoan</option>
          <option value="Trần Văn Hòa">Trần Văn Hòa</option>
          <option value="Triệu Thị Nhập">Triệu Thị Nhập</option>
          <option value="Trịnh Thị Hương">Trịnh Thị Hương</option>
          <option value="Trịnh Thị Toàn">Trịnh Thị Toàn</option>
          <option value="Trương Thị Như Thủy">Trương Thị Như Thủy</option>
          <option value="Trương Thị Nhung">Trương Thị Nhung</option>
          <option value="Võ Huy Cường">Võ Huy Cường</option>
          <option value="Võ Thị Hoa Nữ">Võ Thị Hoa Nữ</option>
          <option value="Vũ Thị Chiều">Vũ Thị Chiều</option>
          <option value="Vũ Thị Hằng">Vũ Thị Hằng</option>
          <option value="Vũ Văn Hiệp">Vũ Văn Hiệp</option>
          <option value="Vũ Thị Huyền">Vũ Thị Huyền</option>
          <option value="Vũ Thị Tuyến">Vũ Thị Tuyến</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Số điện thoại (Tên đăng nhập CSDL):</label>
        <input type="text" id="cfg-username" class="form-control" placeholder="Nhập số điện thoại" autocomplete="off" />
      </div>

      <div class="form-group">
        <label>3. Mật khẩu đăng nhập CSDL:</label>
        <div class="password-wrap">
          <input type="password" id="cfg-password" class="form-control" placeholder="Nhập mật khẩu CSDL" autocomplete="off" />
          <button type="button" id="btn-toggle-pass" class="btn-toggle-eye" title="Hiện/Ẩn mật khẩu">👁️</button>
        </div>
      </div>

      <button type="button" id="btn-save" class="btn-main btn-blue">💾 LƯU CẤU HÌNH CỦA TÔI</button>
    </div>

    <!-- KHỐI 2: NHẬP LỊCH THỜI KHÓA BIỂU -->
    <div class="card">
      <div class="card-title">
        <span>📅</span> Thời Khóa Biểu & Quy Luật Tiết Dạy
      </div>

      <div id="tkb-status-info" class="tkb-status-box">
        Đang tải dữ liệu thời khóa biểu...
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button type="button" id="btn-upload-tkb" class="btn-main btn-green">
          📁 Nhập File TKB Mới (.xlsx, .csv)
        </button>
        <input type="file" id="input-tkb-file" accept=".xlsx,.xls,.csv,.txt" style="display: none;" />

        <button type="button" id="btn-reset-default-tkb" class="btn-main btn-light" style="font-size: 11.5px; padding: 7px;">
          🔄 Đặt Lại TKB Chuẩn Toàn Trường (60 GV)
        </button>
      </div>
    </div>

    <!-- KHỐI 3: KIỂM TRA PHIÊN BẢN MỚI -->
    <div class="card">
      <button type="button" id="btn-check-version" class="btn-main btn-light">
        🔄 Kiểm Tra Phiên Bản Mới
      </button>
      <div id="version-check-result" style="display: none; margin-top: 8px; font-size: 11.5px; text-align: center;"></div>
    </div>

  </div>

  <div class="footer">
    <div>© 2026 <strong>Thầy Nông Văn Hùng</strong> & Cộng đồng AI Giáo dục Đồng Nai</div>
    <div class="footer-links">
      <a href="https://zalo.me/g/2vhbtmsqdr06gyfiuru8" target="_blank" class="footer-link">💬 Zalo AI</a>
      <span>•</span>
      <a href="https://github.com/hungcnfree/lbg-dongnai" target="_blank" class="footer-link">🚀 GitHub</a>
    </div>
  </div>

  <script src="xlsx.mini.min.js"></script>
  <script src="template_lbg_base64.js"></script>
  <script src="default_school_tkb.js"></script>
  <script src="lbg_excel_engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
