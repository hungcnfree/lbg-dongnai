<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trợ Lý CSDL v5.5.3 🌻</title>
  <style>
    :root {
      --bg-paper: #FFFDF0;
      --border-dark: #78350F;
      --text-dark: #1E293B;
      --text-muted: #78350F;
      --primary-blue: #D97706;
      --emerald-green: #059669;
      --sun-gold: #F59E0B;
      --sun-yellow: #FBBF24;
      --sun-light: #FEF3C7;
      --sun-cream: #FFFBEB;
      --radius-sm: 8px;
      --radius-md: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #FFFDF0 0%, #FFFBEB 100%);
      color: var(--text-dark);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .header {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%);
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .header-title {
      font-weight: 800;
      font-size: 14px;
      color: #78350F;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-sub {
      font-size: 11px;
      font-weight: 700;
      color: #D97706;
    }
    .version-badge {
      font-size: 11px;
      font-weight: 800;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #FFF;
      border: 1.5px solid var(--border-dark);
      padding: 2px 8px;
      border-radius: 20px;
      box-shadow: 1px 1px 0px var(--border-dark);
    }
    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #FFF;
      border: 2px solid #F59E0B;
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: 2px 2px 0px #D97706;
    }
    .card-title {
      font-weight: 800;
      font-size: 12.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #92400E;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 11.5px;
      margin-bottom: 4px;
      color: #334155;
    }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      background: #FFF;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary-blue);
    }
    .password-wrap {
      position: relative;
    }
    .btn-toggle-eye {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-main {
      width: 100%;
      padding: 9px;
      font-size: 12.5px;
      font-weight: 800;
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-main:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }
    .btn-blue {
      background: var(--primary-blue);
      color: #FFF;
    }
    .btn-green {
      background: var(--emerald-green);
      color: #FFF;
    }
    .btn-light {
      background: #F8FAFC;
      color: var(--text-dark);
    }
    .tkb-status-box {
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 11.5px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .footer {
      padding: 10px 14px;
      border-top: 1.5px solid #CBD5E1;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      background: #FAFAFA;
    }
    .footer-links {
      margin-top: 4px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .footer-link {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- HEADER (HOA MẶT TRỜI & NẮNG VÀNG) -->
  <div class="header">
    <div>
      <div class="header-title">🌻 TRỢ LÝ TỰ ĐỘNG CSDL</div>
      <div class="header-sub">☀️ Hoa Mặt Trời & Nắng Vàng</div>
    </div>
    <div class="version-badge">v5.5.3</div>
  </div>

  <div class="content">

    <!-- KHỐI 1: CẤU HÌNH TÀI KHOẢN -->
    <div class="card">
      <div class="card-title">
        <span>⚙️</span> Cấu Hình Tài Khoản Giáo Viên
      </div>

      <div class="form-group">
        <label>1. Chọn tên Thầy/Cô (60 GV toàn trường):</label>
        <select id="cfg-name" class="form-control">
          <option value="">-- Bấm chọn tên Thầy/Cô --</option>
          <option value="Bùi Thị Hiền">Bùi Thị Hiền</option>
          <option value="Bùi Thị Hưởng">Bùi Thị Hưởng</option>
          <option value="Bùi Văn Chính">Bùi Văn Chính</option>
          <option value="Bùi Văn Đãi">Bùi Văn Đãi</option>
          <option value="Bùi Văn Giang">Bùi Văn Giang</option>
          <option value="Bùi Văn Tuyên">Bùi Văn Tuyên</option>
          <option value="Cao thị Tuyết Phương">Cao thị Tuyết Phương</option>
          <option value="Dương Thanh Thừa">Dương Thanh Thừa</option>
          <option value="Đặng Thị Oanh">Đặng Thị Oanh</option>
          <option value="Đặng Thị Uyên">Đặng Thị Uyên</option>
          <option value="Hà Văn Lập">Hà Văn Lập</option>
          <option value="Hồ Đình triệu">Hồ Đình triệu</option>
          <option value="Hồ Thị Quỳnh">Hồ Thị Quỳnh</option>
          <option value="Hỏa Thị Chính">Hỏa Thị Chính</option>
          <option value="Hoàng Thị Nguyệt">Hoàng Thị Nguyệt</option>
          <option value="Hoàng Thị Thúy">Hoàng Thị Thúy</option>
          <option value="Hoàng Văn Huy">Hoàng Văn Huy</option>
          <option value="Lê Hữu Thọ">Lê Hữu Thọ</option>
          <option value="Lê Nguyễn Cẩm Hương">Lê Nguyễn Cẩm Hương</option>
          <option value="Lê Thị Hằng">Lê Thị Hằng</option>
          <option value="Lê Thị Hồng Lan">Lê Thị Hồng Lan</option>
          <option value="Lê Thị Ngọc Tú">Lê Thị Ngọc Tú</option>
          <option value="Lê Thị Sông Hồng">Lê Thị Sông Hồng</option>
          <option value="Lê Thị Trinh">Lê Thị Trinh</option>
          <option value="Lương Thị Thu">Lương Thị Thu</option>
          <option value="Nguyễn Chí Công">Nguyễn Chí Công</option>
          <option value="Nguyễn Thanh Hồng">Nguyễn Thanh Hồng</option>
          <option value="Nguyễn Thị Đan">Nguyễn Thị Đan</option>
          <option value="Nguyễn Thị Lan Anh">Nguyễn Thị Lan Anh</option>
          <option value="Nguyễn Thị Lương">Nguyễn Thị Lương</option>
          <option value="Nguyễn Thị Nga">Nguyễn Thị Nga</option>
          <option value="Nguyễn Thị Oanh">Nguyễn Thị Oanh</option>
          <option value="Nguyễn Thị Thu Hằng">Nguyễn Thị Thu Hằng</option>
          <option value="Nguyễn Thị Vân">Nguyễn Thị Vân</option>
          <option value="Nguyễn Trung Ấn">Nguyễn Trung Ấn</option>
          <option value="Nguyễn Văn Linh">Nguyễn Văn Linh</option>
          <option value="Nguyễn Văn Thụ">Nguyễn Văn Thụ</option>
          <option value="Nông Văn Hùng">Nông Văn Hùng</option>
          <option value="Phạm Kim Chi">Phạm Kim Chi</option>
          <option value="Phạm Tới">Phạm Tới</option>
          <option value="Tô Hồng Đình Khiết">Tô Hồng Đình Khiết</option>
          <option value="Trần Đình Hồ">Trần Đình Hồ</option>
          <option value="Trần Ngọc Thìn">Trần Ngọc Thìn</option>
          <option value="Trần Thị Hồng Hạnh">Trần Thị Hồng Hạnh</option>
          <option value="Trần Thị Huệ">Trần Thị Huệ</option>
          <option value="Trần Thị Thoan">Trần Thị Thoan</option>
          <option value="Trần Thu Hà">Trần Thu Hà</option>
          <option value="Trần Văn Hòa">Trần Văn Hòa</option>
          <option value="Triệu Thị Nhập">Triệu Thị Nhập</option>
          <option value="Trịnh Thị Hương">Trịnh Thị Hương</option>
          <option value="Trịnh Thị Toàn">Trịnh Thị Toàn</option>
          <option value="Trương Thị Như Thủy">Trương Thị Như Thủy</option>
          <option value="Trương Thị Nhung">Trương Thị Nhung</option>
          <option value="Võ Huy Cường">Võ Huy Cường</option>
          <option value="Võ Thị Hoa Nữ">Võ Thị Hoa Nữ</option>
          <option value="Vũ Thị Chiều">Vũ Thị Chiều</option>
          <option value="Vũ Thị Hằng">Vũ Thị Hằng</option>
          <option value="Vũ Thị Huyền">Vũ Thị Huyền</option>
          <option value="Vũ Thị Tuyến">Vũ Thị Tuyến</option>
          <option value="Vũ Văn Hiệp">Vũ Văn Hiệp</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Số điện thoại (Tên đăng nhập CSDL):</label>
        <input type="text" id="cfg-username" class="form-control" placeholder="Nhập số điện thoại" autocomplete="off" />
      </div>

      <div class="form-group">
        <label>3. Mật khẩu đăng nhập CSDL:</label>
        <div class="password-wrap">
          <input type="password" id="cfg-password" class="form-control" placeholder="Nhập mật khẩu CSDL" autocomplete="off" />
          <button type="button" id="btn-toggle-pass" class="btn-toggle-eye" title="Hiện/Ẩn mật khẩu">👁️</button>
        </div>
      </div>

      <button type="button" id="btn-save" class="btn-main btn-blue">💾 LƯU CẤU HÌNH CỦA TÔI</button>
    </div>

    <!-- KHỐI 2: NHẬP LỊCH THỜI KHÓA BIỂU -->
    <div class="card">
      <div class="card-title">
        <span>📅</span> Thời Khóa Biểu & Quy Luật Tiết Dạy
      </div>

      <div id="tkb-status-info" class="tkb-status-box">
        Đang tải dữ liệu thời khóa biểu...
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button type="button" id="btn-upload-tkb" class="btn-main btn-green">
          📁 Nhập File TKB Mới (.xlsx, .csv)
        </button>
        <input type="file" id="input-tkb-file" accept=".xlsx,.xls,.csv,.txt" style="display: none;" />

        <button type="button" id="btn-reset-default-tkb" class="btn-main btn-light" style="font-size: 11.5px; padding: 7px;">
          🔄 Đặt Lại TKB Chuẩn Toàn Trường (60 GV)
        </button>
      </div>
    </div>

    <!-- KHỐI 3: CẬP NHẬT PHIÊN BẢN MỚI 1-CLICK -->
    <div class="card">
      <button type="button" id="btn-check-version" class="btn-main btn-blue" style="width: 100%; font-size: 13px; padding: 10px;">
        ⚡ Cập Nhật Phiên Bản Mới (1-Click)
      </button>

      <!-- Thanh trạng thái 100% -->
      <div id="update-progress-wrap" style="display: none; margin-top: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 11px; font-weight: 700;">
          <span id="update-status-text" style="color: #2563EB;">Đang chuẩn bị...</span>
          <span id="update-percent-text" style="color: #0F172A; font-weight: 800;">0%</span>
        </div>
        <div style="width: 100%; height: 10px; background: #E2E8F0; border-radius: 999px; overflow: hidden; border: 1.5px solid #CBD5E1;">
          <div id="update-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #2563EB 0%, #10B981 100%); transition: width 0.3s ease-in-out;"></div>
        </div>
      </div>

      <div id="version-check-result" style="display: none; margin-top: 10px; font-size: 11.5px; text-align: left;"></div>
    </div>

  </div>

  <div class="footer">
    <div>🌻 © 2026 <strong>Cộng Đồng Giáo Viên Chuyển Đổi Số</strong> ☀️</div>
    <div class="footer-links">
      <a href="https://zalo.me/g/2vhbtmsqdr06gyfiuru8" target="_blank" class="footer-link">💬 Zalo AI</a>
      <span>•</span>
      <a href="https://github.com/hungcnfree/lbg-dongnai" target="_blank" class="footer-link">🚀 GitHub</a>
    </div>
  </div>

  <script src="xlsx.mini.min.js"></script>
  <script src="template_lbg_base64.js"></script>
  <script src="default_school_tkb.js"></script>
  <script src="lbg_excel_engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
